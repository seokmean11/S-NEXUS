services:
  snexus-mariadb:
    image: mariadb:11.8
    container_name: snexus-mariadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:7000:3306"
    environment:
      MARIADB_DATABASE: snexus
      MARIADB_USER: snexus
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-allowed-packet=512M
    volumes:
      - ${SNEXUS_MARIADB_DATA:-/home/seosm/snexus-mariadb-docker}:/var/lib/mysql
